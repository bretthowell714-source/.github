name: Claude PR Review Helper

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-context:
    name: Generate PR Context for Claude
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: pr-diff
        run: |
          git fetch origin ${{ github.base_ref }}
          echo "Files changed:"
          git diff --name-only origin/${{ github.base_ref }}...HEAD
          echo ""
          echo "Line changes:"
          git diff --stat origin/${{ github.base_ref }}...HEAD

      - name: Generate PR summary
        id: summary
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            let summary = '## 🤖 Claude PR Review Context\n\n';
            summary += `**PR Title:** ${pr.title}\n`;
            summary += `**Author:** @${pr.user.login}\n`;
            summary += `**Base:** \`${pr.base.ref}\` ← **Head:** \`${pr.head.ref}\`\n\n`;
            summary += `### Files Changed (${files.length})\n`;

            files.forEach(file => {
              summary += `- \`${file.filename}\` (+${file.additions} -${file.deletions})\n`;
            });

            summary += '\n### 📋 Review Checklist\n';
            summary += '- [ ] Code follows project conventions\n';
            summary += '- [ ] Tests added/updated\n';
            summary += '- [ ] Documentation updated\n';
            summary += '- [ ] No security issues\n';
            summary += '- [ ] Performance considered\n';
            summary += '- [ ] Breaking changes documented\n';

            return summary;

      - name: Comment PR with context
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `${{ steps.summary.outputs.result }}`;

            // Find existing bot comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Claude PR Review Context')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: summary
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary
              });
            }
